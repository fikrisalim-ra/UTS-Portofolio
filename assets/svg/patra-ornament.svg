<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Contemporary Reinterpretation of Balinese Patra Punggel & Padma Axis -->
  <title>Modern Balinese Patra Punggel &amp; Padma Geometric Divider</title>
  <desc>Vector monoline ornament combining traditional Balinese stepped architectural geometry and Patra scroll curves.</desc>
  
  <!-- Outer Structural Axis Lines (Batu Padas Warm Gray) -->
  <line x1="10" y1="40" x2="108" y2="40" stroke="#B8B1A6" stroke-width="1"/>
  <line x1="212" y1="40" x2="310" y2="40" stroke="#B8B1A6" stroke-width="1"/>
  <circle cx="10" cy="40" r="2.5" fill="#A65D43"/>
  <circle cx="310" cy="40" r="2.5" fill="#A65D43"/>

  <!-- Left Patra Punggel Geometric Scroll -->
  <path d="M108 40 C96 40, 92 24, 80 24 C70 24, 66 32, 72 38 C76 42, 82 38, 80 33" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M108 40 C96 40, 92 56, 80 56 C70 56, 66 48, 72 42 C76 38, 82 42, 80 47" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Right Patra Punggel Geometric Scroll -->
  <path d="M212 40 C224 40, 228 24, 240 24 C250 24, 254 32, 248 38 C244 42, 238 38, 240 33" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M212 40 C224 40, 228 56, 240 56 C250 56, 254 48, 248 42 C244 38, 238 42, 240 47" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stepped Candi Bentar Inner Brackets -->
  <path d="M126 24 L118 24 L118 32 L110 32 L110 48 L118 48 L118 56 L126 56" stroke="#252525" stroke-width="1.25"/>
  <path d="M194 24 L202 24 L202 32 L210 32 L210 48 L202 48 L202 56 L194 56" stroke="#252525" stroke-width="1.25"/>

  <!-- Center Sanga Mandala / Padma Diamond Node -->
  <polygon points="160,12 188,40 160,68 132,40" stroke="#A65D43" stroke-width="1.5" fill="#F4F0E8"/>
  <polygon points="160,20 180,40 160,60 140,40" stroke="#B69A62" stroke-width="1" fill="none"/>
  
  <!-- Inner Candi Split Portal Silhouette -->
  <path d="M156 27 L156 53 L147 45 L151 45 L151 35 L156 27 Z" fill="#252525"/>
  <path d="M164 27 L164 53 L173 45 L169 45 L169 35 L164 27 Z" fill="#A65D43"/>
</svg>
