<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" fill="none">
  <title>Modern Balinese Architectural Emblem — Sanga Mandala &amp; Candi Bentar</title>
  <desc>Contemporary geometric vector composition interpreting Balinese Sanga Mandala 9-zone spatial architecture, Candi Bentar split gate symmetry, and Patra Sari linework.</desc>

  <!-- Background Ivory Square with Architectural Border -->
  <rect x="12" y="12" width="496" height="496" fill="#F4F0E8" stroke="#252525" stroke-width="1.5"/>
  <rect x="24" y="24" width="472" height="472" fill="none" stroke="#B8B1A6" stroke-width="1"/>

  <!-- Sanga Mandala 9-Zone Structural Hairlines -->
  <line x1="181" y1="24" x2="181" y2="496" stroke="#D5CFC4" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="339" y1="24" x2="339" y2="496" stroke="#D5CFC4" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="24" y1="181" x2="496" y2="181" stroke="#D5CFC4" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="24" y1="339" x2="496" y2="339" stroke="#D5CFC4" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Corner Karang Asti / Stepped Brackets (4 Corners) -->
  <!-- Top-Left -->
  <path d="M24 72 L48 72 L48 48 L72 48 L72 24" stroke="#A65D43" stroke-width="1.75"/>
  <circle cx="48" cy="48" r="3" fill="#B69A62"/>
  <!-- Top-Right -->
  <path d="M496 72 L472 72 L472 48 L448 48 L448 24" stroke="#A65D43" stroke-width="1.75"/>
  <circle cx="472" cy="48" r="3" fill="#B69A62"/>
  <!-- Bottom-Left -->
  <path d="M24 448 L48 448 L48 472 L72 472 L72 496" stroke="#A65D43" stroke-width="1.75"/>
  <circle cx="48" cy="472" r="3" fill="#B69A62"/>
  <!-- Bottom-Right -->
  <path d="M496 448 L472 448 L472 472 L448 472 L448 496" stroke="#A65D43" stroke-width="1.75"/>
  <circle cx="472" cy="472" r="3" fill="#B69A62"/>

  <!-- Outer Compass / Padma Bhuwana Concentric Rings -->
  <circle cx="260" cy="260" r="190" stroke="#B8B1A6" stroke-width="1"/>
  <circle cx="260" cy="260" r="168" stroke="#B69A62" stroke-width="1.25"/>
  <polygon points="260,56 464,260 260,464 56,260" stroke="#252525" stroke-width="1.25" fill="none"/>

  <!-- Patra Punggel Geometric Corner Flourishes on the Diamond -->
  <path d="M260 74 C244 92, 232 92, 232 104 C232 114, 244 116, 248 106" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260 74 C276 92, 288 92, 288 104 C288 114, 276 116, 272 106" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260 446 C244 428, 232 428, 232 416 C232 406, 244 404, 248 414" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M260 446 C276 428, 288 428, 288 416 C288 406, 276 404, 272 414" stroke="#B69A62" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Central Candi Bentar Split Portal (Architectural Reinterpretation) -->
  <!-- Left Wing (Charcoal Mangsi — Information Systems Structure) -->
  <path d="M244 132
           L244 364
           L148 364
           L148 336
           L168 336
           L168 296
           L188 296
           L188 252
           L206 252
           L206 208
           L222 208
           L222 168
           L234 168
           L234 146
           Z" fill="#252525"/>
  <!-- Left Wing Inner Geometric Carving Lines -->
  <path d="M232 184 L232 348 L172 348" stroke="#B69A62" stroke-width="1.25"/>
  <rect x="200" y="272" width="22" height="54" stroke="#F4F0E8" stroke-width="1" fill="none"/>

  <!-- Right Wing (Terracotta Bata Merah — Visual Communication & Automation) -->
  <path d="M276 132
           L276 364
           L372 364
           L372 336
           L352 336
           L352 296
           L332 296
           L332 252
           L314 252
           L314 208
           L298 208
           L298 168
           L286 168
           L286 146
           Z" fill="#A65D43"/>
  <!-- Right Wing Inner Geometric Carving Lines -->
  <path d="M288 184 L288 348 L348 348" stroke="#F4F0E8" stroke-width="1.25"/>
  <rect x="298" y="272" width="22" height="54" stroke="#B69A62" stroke-width="1" fill="none"/>

  <!-- Center Negative Space Axis & Floating Sun / Padma Node -->
  <line x1="260" y1="108" x2="260" y2="394" stroke="#B69A62" stroke-width="1.25" stroke-dasharray="3 3"/>
  <circle cx="260" cy="132" r="6" fill="#B69A62" stroke="#F4F0E8" stroke-width="2"/>

  <!-- Base Pedestal Steps (Nista / Foundation) -->
  <rect x="128" y="364" width="264" height="12" fill="#252525"/>
  <rect x="112" y="376" width="296" height="10" fill="#A65D43"/>
  <line x1="92" y1="386" x2="428" y2="386" stroke="#252525" stroke-width="1.5"/>

  <!-- Coordinate Labels (Editorial Metadata Integration) -->
  <text x="38" y="42" fill="#787269" font-family="monospace" font-size="10" letter-spacing="2">UTAMA // 08.65°S</text>
  <text x="378" y="42" fill="#787269" font-family="monospace" font-size="10" letter-spacing="2">115.21°E // BALI</text>
  <text x="38" y="486" fill="#787269" font-family="monospace" font-size="10" letter-spacing="2">SANGA MANDALA GRID</text>
  <text x="386" y="486" fill="#A65D43" font-family="monospace" font-size="10" letter-spacing="2">FIKRI // IS-PORTFOLIO</text>
</svg>
